# BetIntel no Raspberry Pi 5 (ARM64): Postgres + Redis + API.
# A imagem da API é construída no próprio Pi (nativa ARM64) a partir do repositório.
# Os segredos ficam fora do repositório, em /srv/betintel/.env (modelo: deploy/pi/.env.example).
# Os dados (Postgres, Redis, fotos) ficam em pastas dentro de /srv: BETINTEL_DATA_DIR (omissão /srv/betintel/data).
# Não se usam volumes do Docker para os dados: o Docker deste Pi é gerido pelo Home Assistant Supervised.
#
# Uso (a partir da raiz do repositório clonado no Pi, ou pelo workflow de deploy):
#   docker compose -f deploy/pi/docker-compose.yml --env-file /srv/betintel/.env up -d --build
name: betintel

services:
  betintel-db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: betintel
      POSTGRES_USER: betintel_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD em /srv/betintel/.env}
    volumes:
      - ${BETINTEL_DATA_DIR:-/srv/betintel/data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U betintel_user -d betintel']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app_network]

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - ${BETINTEL_DATA_DIR:-/srv/betintel/data}/redis:/data
    networks: [app_network]

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: betintel-api:local
    restart: always
    env_file: ${BETINTEL_ENV_FILE:-/srv/betintel/.env}
    environment:
      DATABASE_URL: postgresql://betintel_user:${POSTGRES_PASSWORD}@betintel-db:5432/betintel
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      PORT: 3000
      TZ: UTC
      BETANO_EGRESS_URL: http://betano-egress:8765
    ports:
      # Só localmente: o acesso público é feito pelo Cloudflare Tunnel.
      # No Pi a porta 3000 já está ocupada (addon eWeLink do Home Assistant), por isso usa-se a 3100.
      - '127.0.0.1:${API_HOST_PORT:-3100}:3000'
    volumes:
      - ${BETINTEL_DATA_DIR:-/srv/betintel/data}/uploads:/app/apps/api/uploads
    depends_on:
      betintel-db:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [app_network]

  # Sidecar de rede da Betano (curl_cffi com fingerprint TLS/HTTP2 de browser). Só a API lhe fala,
  # com o token BETANO_EGRESS_TOKEN. Ver services/betano-egress/README.md.
  betano-egress:
    build:
      context: ../../services/betano-egress
    image: betintel-betano-egress:local
    restart: always
    environment:
      BETANO_EGRESS_TOKEN: ${BETANO_EGRESS_TOKEN:-}
      BETANO_IMPERSONATE: ${BETANO_IMPERSONATE:-chrome}
    ports:
      # Só localmente, para verificações; a API chega-lhe pela rede app_network.
      - '127.0.0.1:8765:8765'
    mem_limit: 256m
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks: [app_network]

networks:
  app_network:
    external: true
